; Konfiguracja dla PlatformIO (alternatywa dla Arduino IDE).
; Kompilacja i wgranie:  pio run -t upload
; Monitor portu szeregowego:  pio device monitor

[platformio]
src_dir = .

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test/>
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
