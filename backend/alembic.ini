[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# UWAGA: ten plik musi byc czystym ASCII (bez polskich znakow i myslnikow).
# Alembic i logging.config czytaja go w kodowaniu lokalizacji systemu, a na
# hostingu wspoldzielonym bywa ona ASCII - jeden znak spoza ASCII wywraca
# wtedy start aplikacji. Pilnuje tego test tests/test_migracje.py.
# URL bazy jest pobierany z konfiguracji aplikacji (env.py) - tutaj celowo pusty.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
