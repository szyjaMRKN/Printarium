[project]
name = "ewidencja-backend"
version = "0.1.0"
description = "Backend ewidencji działalności nierejestrowanej"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
