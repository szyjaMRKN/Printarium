# Wariant alternatywny do Caddy: Nginx + certyfikaty z Let's Encrypt (certbot).
#
# Użycie: zamiast usługi `web` z docker-compose.yml postaw Nginksa na hoście,
# a backend wystaw lokalnie (np. 127.0.0.1:8000). Pliki frontendu skopiuj
# z kontenera lub zbuduj lokalnie: cd frontend && npm ci && npm run build.

server {
    listen 80;
    listen [::]:80;
    server_name ewidencja.przyklad.pl;

    # Weryfikacja domeny przez certbota.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ewidencja.przyklad.pl;

    ssl_certificate     /etc/letsencrypt/live/ewidencja.przyklad.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ewidencja.przyklad.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Załączniki i eksporty potrafią być większe niż domyślny limit.
    client_max_body_size 25m;

    root /var/www/ewidencja;      # katalog z zawartością frontend/dist
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
